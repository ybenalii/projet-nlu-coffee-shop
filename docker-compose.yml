# docker-compose.yml — Exercice (projet NLU) : la même plateforme qu'au TP2 et au TP3.
#   - rustfs       : stockage des artefacts (compatible S3)
#   - rustfs-setup : crée le bucket une fois, puis s'arrête
#   - mlflow       : le serveur de tracking (UI sur http://localhost:5000)
#
# RustFS parle l'API S3, le standard d'Amazon : 9000 = API S3, 9001 = console web.
services:
  rustfs:
    image: rustfs/rustfs:1.0.6
    container_name: projet-rustfs
    restart: unless-stopped
    ports:
      # 127.0.0.1 : accessible depuis cette machine seulement (pas depuis le réseau)
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - mlops

  rustfs-setup:
    image: amazon/aws-cli:latest
    container_name: projet-rustfs-setup
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: >
      /bin/sh -c "
      set -e;
      aws --endpoint-url http://rustfs:9000 s3api head-bucket --bucket mlflow-artifacts 2>/dev/null
      || aws --endpoint-url http://rustfs:9000 s3 mb s3://mlflow-artifacts;
      echo 'Bucket mlflow-artifacts pret';
      "
    networks:
      - mlops

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.14.0  # même version que le client (uv.lock)
    container_name: projet-mlflow
    restart: unless-stopped
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
    volumes:
      - mlflow-data:/mlflow
    # L'image officielle ne contient que mlflow : on ajoute boto3, nécessaire
    # au serveur pour relire les fichiers dans RustFS (onglet Artifacts).
    # Le dépôt des fichiers, lui, est fait par le script (identifiants du .env).
    command: >
      sh -c "pip install --no-cache-dir boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root s3://mlflow-artifacts/"
    depends_on:
      rustfs-setup:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/health').status==200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - mlops

volumes:
  rustfs-data:
  mlflow-data:

networks:
  mlops:
    driver: bridge

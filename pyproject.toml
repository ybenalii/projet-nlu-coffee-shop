[project]
name = "exercice-projet-nlu"
version = "0.1.0"
description = "Exercice — fine-tuner un modèle de NLU sur ses propres données (sujet libre), et le livrer léger"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.9.1",
    "transformers[torch]>=4.57.3",
    "peft>=0.18.0",
    "datasets>=4.4.1",
    "accelerate>=1.12.0",
    "pydantic-settings>=2.0.0",
    "mlflow>=3.7.0",
    "boto3>=1.41.0",  # client S3 : le script dépose les artefacts dans RustFS
    "pyyaml>=6.0",    # lecture de donnees/ontologie.yaml
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
